    name: "@RestController @RequestMapping(\"/api\")"
    source_loc: apps/api/src/main/java/br/com/bardozico/IdentityController.java:9
    target: IdentityController
    must_appear_in_target: true
    notes: "Spring MVC controller exposes identity routes."
  - type: di-registration
    name: "IdentityController constructor injection"
    source_loc: apps/api/src/main/java/br/com/bardozico/IdentityController.java:12
    target: IdentityController
    must_appear_in_target: true
    notes: "Injects Identity, JdbcTemplate, DeviceAccess and configuration values."
runtime_config:
