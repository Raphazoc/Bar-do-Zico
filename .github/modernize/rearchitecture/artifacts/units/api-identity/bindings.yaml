    source_loc: apps/api/src/main/java/br/com/bardozico/IdentityController.java:12
    source: annotation
    default_value: ""
    must_appear_in_target: true
    notes: "Controls Secure cookie attribute."
  - key: bar.training
    source_loc: apps/api/src/main/java/br/com/bardozico/IdentityController.java:12
    source: annotation
    default_value: "false"
    must_appear_in_target: true
    notes: "Selects training cookie name and mode."
  - key: bar.open-access
    source_loc: apps/api/src/main/java/br/com/bardozico/IdentityController.java:12
    source: annotation
    default_value: "false"
    must_appear_in_target: true
    notes: "Enables operator selection without login when allowed."
