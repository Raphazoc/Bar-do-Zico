    description: "Web table-guide action crosses into an optional native desktop printer bridge."
    source: inferred
    cut_between:
      migrated_side: web-table-guide
      frozen_side: desktop-shell
    protocol_shift: {from: "browser function call", to: "native desktop print operation"}
    frozen_side_rule: "desktop-shell native printer behavior MUST NOT be refactored by a web-only change; adapt through the existing optional bridge."
